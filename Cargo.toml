[package]
name = "trail"
version = "0.1.0"
edition = "2021"
description = "Understand how your code changed, not just what changed. A local-first CLI that reconstructs the development history of a Git worktree."
license = "MIT"
repository = "https://github.com/example/trail"
readme = "README.md"
keywords = ["git", "cli", "history", "worktree", "diff"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "trail"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
ulid = "1"
shell-words = "1"
ratatui = "0.30"
ctrlc = "3"
gix = { version = "0.87", default-features = false, features = ["revision", "blob-diff", "sha1", "comfort", "excludes"] }

[dev-dependencies]
tempfile = "3"
chrono = "0.4"
